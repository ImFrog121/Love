<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сердце из частиц</title>
<style>
  :root{color-scheme:dark;--bg:#07000d;--fg:rgba(255,205,228,.6)}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .ui{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  .hint{font-size:12px;letter-spacing:.06em;color:var(--fg);text-align:center;padding:0 16px;transition:opacity 2s}
  .row{display:flex;gap:10px;pointer-events:auto}
  button{font:inherit;font-size:13px;color:#ffd9ea;background:rgba(255,80,140,.12);border:1px solid rgba(255,120,170,.35);
    padding:9px 16px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s}
  button:hover{background:rgba(255,80,140,.28)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="hint" id="hint">веди курсором — частицы разлетаются · удерживай — притягивай · клик — волна</div>
  <div class="row"><button id="b1"></button><button id="b2">Собрать заново</button></div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true });
  if (!gl) { document.body.insertAdjacentHTML('beforeend', '<p style="color:#fff;padding:20px">WebGL недоступен</p>'); return; }
  const TAU = Math.PI * 2, R = Math.random;
  const small = Math.min(innerWidth, innerHeight) < 700;
  const MAX = small ? 45000 : 110000;
  let n = MAX, W, H, dpr, S;

  const VS = `precision highp float;
  attribute vec2 a_from,a_to,a_start; attribute vec4 a_r;
  uniform vec2 u_res; uniform float u_S,u_t,u_g,u_m,u_sc,u_beat,u_dpr,u_gain,u_hold;
  uniform vec3 u_mouse; uniform vec3 u_w[4]; uniform vec3 u_c1,u_c2;
  varying vec3 v_c; varying float v_a;
  const float PI=3.14159265;
  float ease(float x){return x<.5?4.*x*x*x:1.-pow(-2.*x+2.,3.)/2.;}
  vec2 perp(vec2 v){return vec2(-v.y,v.x);}
  void main(){
    float seed=a_r.w; bool dust=seed>.94;
    vec2 pos; float size,alpha=1.,boost=0.;
    if(dust){
      pos=a_to+vec2(sin(u_t*.2+a_r.z*6.),cos(u_t*.17+a_r.z*9.))*1.6;
      size=.7+fract(seed*31.3)*1.3; alpha=.4;
    } else {
      float em=ease(clamp((u_m-a_r.x*.5)/1.6,0.,1.));
      vec2 cur=mix(a_from,a_to,em)+perp(a_to-a_from)*sin(PI*em)*a_r.y*.5;
      float p=clamp((u_g-a_r.x)/2.6,0.,1.), e=ease(p);
      cur*=1.+u_beat*p;
      vec2 d0=cur-a_start;
      pos=a_start+d0*e+perp(d0)*sin(PI*e)*a_r.y;
      pos+=vec2(sin(u_t*1.8+a_r.z*6.28),cos(u_t*1.5+a_r.z*6.28))*.035*p;
      pos=mix(pos,a_start,ease(u_sc));
      size=.9+pow(fract(seed*31.3),2.)*3.2;
      if(fract(seed*17.1)>.985){size*=4.;alpha=.25;}
    }
    vec2 dm=pos-u_mouse.xy; float r=length(dm)+.001, f=exp(-r*r/36.);
    pos+=dm/r*f*u_mouse.z*3.5+perp(dm)/r*f*u_mouse.z*.8;
    pos+=-dm*f*u_hold*.9+perp(dm)*f*u_hold*.35;
    for(int i=0;i<4;i++){
      float age=u_t-u_w[i].z;
      if(age>0.&&age<3.5){
        vec2 dw=pos-u_w[i].xy; float rw=length(dw)+.001;
        float k=exp(-pow((rw-age*13.)/2.2,2.))*(1.-age/3.5);
        pos+=dw/rw*k*3.; boost+=k;
      }
    }
    vec3 c=mix(u_c1,u_c2,pow(fract(seed*13.7),2.));
    c=mix(c,u_c2,smoothstep(0.,20.,length(pos))*.35);
    if(fract(seed*5.1)>.9) c=mix(c,vec3(1.),.65);
    c+=boost*.7;
    v_c=c; v_a=alpha*(.65+.35*sin(u_t*3.+a_r.z*40.))*u_gain*.3*(1.+boost*1.5);
    gl_PointSize=size*u_dpr*(u_S/22.)*(1.+boost*.8);
    gl_Position=vec4(pos*u_S*2./u_res,0.,1.);
  }`;
  const FS = `precision mediump float; varying vec3 v_c; varying float v_a;
  void main(){float d=length(gl_PointCoord-.5)*2.; if(d>1.)discard; gl_FragColor=vec4(v_c*exp(-d*d*3.5)*v_a,1.);}`;
  const QV = `attribute vec2 p; void main(){gl_Position=vec4(p,0.,1.);}`;
  const QF = `precision mediump float; void main(){gl_FragColor=vec4(.027,0.,.05,.2);}`;

  function prog(v, f) {
    const p = gl.createProgram();
    for (const [t, s] of [[gl.VERTEX_SHADER, v], [gl.FRAGMENT_SHADER, f]]) {
      const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); gl.attachShader(p, sh);
    }
    gl.linkProgram(p); return p;
  }
  const P = prog(VS, FS), Q = prog(QV, QF);
  const U = {};
  ['u_res','u_S','u_t','u_g','u_m','u_sc','u_beat','u_dpr','u_gain','u_hold','u_mouse','u_w','u_c1','u_c2']
    .forEach(k => U[k] = gl.getUniformLocation(P, k));
  const A = {};
  ['a_from','a_to','a_start','a_r'].forEach(k => A[k] = gl.getAttribLocation(P, k));
  const qp = gl.getAttribLocation(Q, 'p');

  // ---- Данные частиц ----
  const from = new Float32Array(MAX * 2), to = new Float32Array(MAX * 2);
  const start = new Float32Array(MAX * 2), rnd = new Float32Array(MAX * 4), dust = new Float32Array(MAX * 2);
  const gauss = () => R() + R() + R() - 1.5;
  for (let i = 0; i < MAX; i++) {
    const a = R() * TAU, d = 48 + R() * 32;
    start[2*i] = Math.cos(a) * d; start[2*i+1] = Math.sin(a) * d;
    rnd[4*i] = R() * 2.4; rnd[4*i+1] = (R() - .5) * .9; rnd[4*i+2] = R(); rnd[4*i+3] = R();
    dust[2*i] = (R() - .5) * 80; dust[2*i+1] = (R() - .5) * 60;
  }

  const SHAPES = [
    { name: 'Сердце', c1: [1, .1, .4], c2: [1, .65, .35], pt() {
        const t = R() * TAU, s = Math.sin(t);
        const x = 16 * s * s * s, y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const r = R() < .3 ? 1 - R() * .025 : Math.sqrt(R());
        return [x * r + (R() - .5) * .25, (y + 2) * r + (R() - .5) * .25];
    } },
    { name: 'Галактика', c1: [.3, .45, 1], c2: [.95, .45, 1], pt() {
        const r = Math.pow(R(), .7) * 19, a = Math.floor(R() * 3) * 2.0944 + r * .38 + gauss() * (.3 + r * .03);
        return [Math.cos(a) * r, Math.sin(a) * r * .85];
    } },
    { name: 'Роза', c1: [1, .12, .2], c2: [1, .6, .25], pt() {
        const t = R() * TAU, r = 18 * Math.cos(4 * t) * Math.pow(R(), .4);
        return [Math.cos(t) * r, Math.sin(t) * r];
    } },
    { name: 'Звезда', c1: [1, .8, .3], c2: [.3, .9, 1], pt() {
        const t = R() * TAU, r = 19 * (.42 + .58 * Math.pow(Math.abs(Math.cos(2.5 * t)), 1.6)) * Math.sqrt(R());
        return [Math.cos(t + 1.5708) * r, Math.sin(t + 1.5708) * r];
    } }
  ];
  function fill(arr, sh) {
    for (let i = 0; i < MAX; i++) {
      if (rnd[4*i+3] > .94) { arr[2*i] = dust[2*i]; arr[2*i+1] = dust[2*i+1]; continue; }
      const p = sh.pt(); arr[2*i] = p[0]; arr[2*i+1] = p[1];
    }
  }
  let shape = 0; fill(to, SHAPES[0]); from.set(to);

  const mk = (data, usage) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, usage); return b; };
  const bFrom = mk(from, gl.DYNAMIC_DRAW), bTo = mk(to, gl.DYNAMIC_DRAW);
  const bStart = mk(start, gl.STATIC_DRAW), bR = mk(rnd, gl.STATIC_DRAW);
  const bQ = mk(new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const attr = (loc, buf, size) => { gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); };

  // ---- Состояние ----
  const col1 = SHAPES[0].c1.slice(), col2 = SHAPES[0].c2.slice();
  const waves = new Float32Array(12); [2,5,8,11].forEach(i => waves[i] = -100);
  let wi = 0, gStart = 0, morphAt = -100, scatterAt = 0, lastMorph = 0;
  const ptr = { x: 0, y: 0, on: false, down: false }; let mx = 0, my = 0, mStr = 0, hold = 0;
  const b1 = document.getElementById('b1'), hint = document.getElementById('hint');
  const label = () => b1.textContent = 'Форма: ' + SHAPES[(shape + 1) % SHAPES.length].name;
  label();

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(innerWidth * dpr); H = cv.height = Math.floor(innerHeight * dpr);
    S = Math.min(W / 40, H / 34); gl.viewport(0, 0, W, H);
    gl.clearColor(.027, 0, .05, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  addEventListener('resize', resize); resize();

  function nextShape(t) {
    if (t - morphAt < 3.2 || scatterAt) return;
    from.set(to); shape = (shape + 1) % SHAPES.length; fill(to, SHAPES[shape]);
    gl.bindBuffer(gl.ARRAY_BUFFER, bFrom); gl.bufferData(gl.ARRAY_BUFFER, from, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bTo); gl.bufferData(gl.ARRAY_BUFFER, to, gl.DYNAMIC_DRAW);
    morphAt = lastMorph = t; label();
  }
  function rescatter(t) { if (!scatterAt && t - gStart > 4) scatterAt = t; }
  const now = () => performance.now() / 1000;
  b1.onclick = () => nextShape(now()); document.getElementById('b2').onclick = () => rescatter(now());
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); nextShape(now()); } else if (e.code === 'KeyR') rescatter(now()); });

  const upd = e => { ptr.x = (e.clientX * dpr - W / 2) / S; ptr.y = -(e.clientY * dpr - H / 2) / S; };
  cv.addEventListener('pointermove', e => { upd(e); ptr.on = true; });
  cv.addEventListener('pointerdown', e => {
    upd(e); ptr.on = ptr.down = true; cv.setPointerCapture(e.pointerId);
    waves[wi*3] = ptr.x; waves[wi*3+1] = ptr.y; waves[wi*3+2] = now(); wi = (wi + 1) & 3;
  });
  const up = e => { ptr.down = false; if (e.pointerType !== 'mouse') ptr.on = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => ptr.on = false);

  let last = now(), slow = 0;
  setTimeout(() => hint.style.opacity = .35, 9000);

  function frame() {
    const t = now(), dt = (t - last) * 1000; last = t;
    if (dt > 26) { if (++slow > 40 && n > 15000) { n = (n * .85) | 0; slow = 0; } } else if (slow > 0) slow--;

    let sc = 0;
    if (scatterAt) { const q = (t - scatterAt) / .9; if (q >= 1) { gStart = t; scatterAt = 0; } else sc = q; }
    if (!scatterAt && t - lastMorph > 12 && t - gStart > 6) nextShape(t);

    mStr += ((ptr.on && !ptr.down ? 1 : 0) - mStr) * .12; hold += ((ptr.down ? 1 : 0) - hold) * .1;
    mx += (ptr.x - mx) * .35; my += (ptr.y - my) * .35;
    for (let i = 0; i < 3; i++) { col1[i] += (SHAPES[shape].c1[i] - col1[i]) * .03; col2[i] += (SHAPES[shape].c2[i] - col2[i]) * .03; }

    const g = t - gStart, asm = Math.min(Math.max((g - 2.2) / 2.4, 0), 1);
    const beat = (Math.pow(Math.max(0, Math.sin(t * 2.7)), 10) * .06 + .02 * Math.sin(t * 1.3)) * asm * (1 - sc);

    // затухание шлейфа
    gl.useProgram(Q); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    attr(qp, bQ, 2); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // частицы (аддитивное смешивание)
    gl.useProgram(P); gl.blendFunc(gl.ONE, gl.ONE);
    attr(A.a_from, bFrom, 2); attr(A.a_to, bTo, 2); attr(A.a_start, bStart, 2); attr(A.a_r, bR, 4);
    gl.uniform2f(U.u_res, W, H); gl.uniform1f(U.u_S, S); gl.uniform1f(U.u_t, t); gl.uniform1f(U.u_g, g);
    gl.uniform1f(U.u_m, t - morphAt); gl.uniform1f(U.u_sc, sc); gl.uniform1f(U.u_beat, beat);
    gl.uniform1f(U.u_dpr, dpr); gl.uniform1f(U.u_gain, Math.min(2.2, Math.sqrt(110000 / n)));
    gl.uniform1f(U.u_hold, hold); gl.uniform3f(U.u_mouse, mx, my, mStr);
    gl.uniform3fv(U.u_w, waves); gl.uniform3fv(U.u_c1, col1); gl.uniform3fv(U.u_c2, col2);
    gl.drawArrays(gl.POINTS, 0, n);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
